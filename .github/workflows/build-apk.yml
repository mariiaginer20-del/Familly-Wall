name: Compilar APK de Family Wall

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Generar APK Debug
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Aceptar licencias de Android SDK
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          mkdir -p "$SDK_DIR/licenses"
          { yes || true; } | "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null

      - name: Configurar Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Cachear debug.keystore estable
        uses: actions/cache@v4
        with:
          path: debug.keystore
          key: android-debug-keystore-v1

      - name: Preparar keystore, google-services.json y variables
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
              echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > debug.keystore
            elif [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi
          echo "=== Huella SHA-1 de firma de esta APK (para Firebase Console si hiciera falta) ==="
          keytool -list -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android | grep -E "SHA1:|SHA256:" || true

          if [ ! -f app/google-services.json ] && [ -n "$GOOGLE_SERVICES_JSON" ]; then
            TRIMMED=$(echo "$GOOGLE_SERVICES_JSON" | tr -d '[:space:]')
            if [[ "$TRIMMED" == \{* ]]; then
              printf '%s\n' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            else
              echo "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json
            fi
          fi

          if [ ! -f app/google-services.json ]; then
            echo "::error::Falta app/google-services.json en el repositorio de GitHub."
            echo "Descárgalo desde Firebase Console (proyecto gen-lang-client-0564885100) y añádelo al secreto GOOGLE_SERVICES_JSON o súbelo a la carpeta app/ en GitHub."
            exit 1
          fi

          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi

      - name: Compilar APK (assembleDebug)
        run: gradle assembleDebug --no-daemon --no-build-cache

      - name: Preparar APK para descarga directa
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          cp "$APK_PATH" FamilyWall-debug.apk
          ls -lh FamilyWall-debug.apk

      - name: Subir APK como Artifact descargable
        uses: actions/upload-artifact@v4
        with:
          name: FamilyWall-debug-apk
          path: FamilyWall-debug.apk
          if-no-files-found: error

      - name: Publicar APK en GitHub Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Family Wall v1.0.${{ github.run_number }}
          body: "APK compilado automáticamente. Descarga **FamilyWall-debug.apk** directamente sin descomprimir."
          files: FamilyWall-debug.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
